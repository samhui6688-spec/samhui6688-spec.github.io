<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2; url=https://aevos-hk.github.io/">
<link rel="canonical" href="https://aevos-hk.github.io/">
<title>Aevos 齡界已搬家</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;background:#FBFBFD;color:#1D1D1F;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK",sans-serif}a{color:#0B5F57}</style>
</head>
<body>
<p>Aevos 齡界已搬到 <a href="https://aevos-hk.github.io/">aevos-hk.github.io</a></p>
<script>
(async function () {
  try { if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (new URL(r.scope).pathname === '/aevos/') await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) if (k.startsWith('aevos-')) await caches.delete(k); } catch (e) {}
  location.replace('https://aevos-hk.github.io/');
})();
</script>
</body>
</html>
